name: CI

# push / PR 时编译 + 跑单元测试，避免坏提交到发版才暴露
on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 不依赖 android-actions/setup-android（其在 cmdline-tools 16 上会因缺少旧 tools 包而失败）
      - name: 接受 Android SDK 许可
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      # Android Studio 自动生成的本机 daemon JVM 锁定（Java 20/oracle），CI 上删除以使用 JAVA_HOME(JDK 17)
      - name: 清理本机 Gradle JDK 锁定
        run: rm -f gradle/gradle-daemon-jvm.properties

      # maven.aliyun.com 在 GitHub 海外 runner 上返回 502（本地 CN 正常），构建时临时移除、仅走官方仓库
      - name: CI 环境移除 aliyun 镜像
        run: sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      - name: 编译 + 单元测试
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
