name: diag
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.0-1.0.29/com.google.devtools.ksp.gradle.plugin-2.1.0-1.0.29.pom"
          for u in \
            "https://repo1.maven.org/maven2/$base" \
            "https://plugins.gradle.org/m2/$base" \
            "https://maven.aliyun.com/repository/google/$base" \
            "https://maven.aliyun.com/repository/central/$base" \
            "https://maven.aliyun.com/repository/gradle-plugin/$base" \
            "https://dl.google.com/dl/android/maven2/$base" \
            "https://dl.google.com/dl/android/maven2/com/google/devtools/ksp/ksp-gradle-plugin/2.1.0-1.0.29/ksp-gradle-plugin-2.1.0-1.0.29.pom" ; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$u")
            echo "$code  $u"
          done
