name: 发版 Release

# 推送形如 v2.14 的 tag 时自动构建 APK 并发布 GitHub Release；
# 也可在 Actions 页手动触发并填入已有 tag 重新发版（workflow_dispatch）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag（如 v2.14）"
        required: true
        type: string

permissions:
  contents: write

env:
  REL_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REL_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不依赖 android-actions/setup-android（其在 cmdline-tools 16 上会因缺少旧 tools 包而失败）：
      # 用镜像自带 SDK，仅补一次许可证接受，缺失的 platforms/build-tools 由 AGP 自动下载
      - name: 接受 Android SDK 许可
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: 校验 tag 与 versionName 一致
        run: |
          expected="${REL_TAG#v}"
          actual="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ -z "$actual" ]; then
            echo "::error::未能从 app/build.gradle.kts 解析 versionName"
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag 为 v$expected，但 app/build.gradle.kts 的 versionName 为 \"$actual\"，请先同步修改再打 tag"
            exit 1
          fi
          echo "版本号校验通过：v$actual"

      - name: 从 CHANGELOG.md 提取发布说明
        run: |
          awk -v tag="$REL_TAG" '
            $0 ~ "^## " tag "([ (]|$)" { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "::error::CHANGELOG.md 中找不到 $REL_TAG 章节，请先补充更新日志"
            exit 1
          fi
          {
            printf '# CourseSchedule 更新日志\n\n'
            printf '## %s (%s)\n\n' "$REL_TAG" "$(date +%F)"
            cat notes-body.md
          } > release-notes.md

      # 本机 ~/.android/debug.keystore 的 base64，保证 CI 签名与现网安装包一致、可覆盖升级
      - name: 还原签名 keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::仓库未配置 secret ANDROID_DEBUG_KEYSTORE_B64（本机 ~/.android/debug.keystore 的 base64），无法发版"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"

      # Android Studio 自动生成的本机 daemon JVM 锁定（Java 20/oracle），CI 上删除以使用 JAVA_HOME(JDK 17)
      - name: 清理本机 Gradle JDK 锁定
        run: rm -f gradle/gradle-daemon-jvm.properties

      # maven.aliyun.com 在 GitHub 海外 runner 上返回 502（本地 CN 正常），构建时临时移除、仅走官方仓库
      - name: CI 环境移除 aliyun 镜像
        run: sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      - name: 构建 release APK
        run: ./gradlew :app:assembleRelease

      - name: 重命名 APK
        run: mv app/build/outputs/apk/release/app-release.apk "${REL_TAG}.apk"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          body_path: release-notes.md
          files: ${{ env.REL_TAG }}.apk
